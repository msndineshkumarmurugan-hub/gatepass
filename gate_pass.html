<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Gate Pass</title>
<style>

:root[data-theme="dark"]{--bg:#15171a;--fg:#eee;--mut:#9aa;--card:#1e2126;--line:#33383f;--acc:#5aa2ee;--accfg:#08111c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans Tamil","Segoe UI",sans-serif}
main{max-width:440px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 16px}
label{display:block;font-size:14px;color:var(--mut);margin:14px 0 6px}
select{width:100%;font:inherit;font-size:20px;padding:12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
input{width:100%;font:inherit;font-size:22px;padding:12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
#veh{font-weight:700;letter-spacing:1px;text-transform:uppercase}
.row{display:flex;gap:10px;margin-top:16px}
button{flex:1;font:inherit;font-size:18px;font-weight:600;padding:14px;border-radius:8px;border:1.5px solid var(--acc);background:var(--acc);color:var(--accfg)}
button.alt{background:transparent;color:var(--acc)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#sheet{margin-top:22px;text-align:center}
#c{display:none;width:250px;height:675px;background:#fff}
#pimg{width:250px;height:675px;background:#fff;border:1px solid var(--line);image-rendering:pixelated}
#msg{min-height:20px;color:var(--mut);font-size:14px;margin-top:8px}
#dlg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:20px;z-index:10}
.box{background:var(--card);color:var(--fg);border-radius:12px;padding:20px;max-width:380px;width:100%}
.box p{font-size:18px;line-height:1.4;margin:0 0 6px}
@page{size:50mm 135mm;margin:0}
@media print{
html,body{background:#fff}
main>*:not(#sheet){display:none!important}
#dlg{display:none!important}
main{padding:0;max-width:none}
#sheet{margin:0}
#c{width:50mm;height:135mm;border:0;display:block!important;image-rendering:pixelated}
#pimg{display:none!important}
}
</style>
</head>

<h1>Gate Pass</h1>
<label for="veh">Vehicle Number</label>

var QRMode = require('./QRMode');

function QR8bitByte(data) {
	this.mode = QRMode.MODE_8BIT_BYTE;
	this.data = data;
}

QR8bitByte.prototype = {

	getLength : function() {
		return this.data.length;
	},
	
	write : function(buffer) {
		for (var i = 0; i < this.data.length; i++) {
			// not JIS ...
			buffer.put(this.data.charCodeAt(i), 8);
		}
	}
};

module.exports = QR8bitByte;

};
defs['QRBitBuffer']=function(module,exports,require){
function QRBitBuffer() {
	this.buffer = [];
	this.length = 0;
}

QRBitBuffer.prototype = {

	get : function(index) {
		var bufIndex = Math.floor(index / 8);
		return ( (this.buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
	},
	
	put : function(num, length) {
		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}
	},
	
	getLengthInBits : function() {
		return this.length;
	},
	
	putBit : function(bit) {
	
		var bufIndex = Math.floor(this.length / 8);
		if (this.buffer.length <= bufIndex) {
			this.buffer.push(0);
		}
	
		if (bit) {
			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );
		}
	
		this.length++;
	}
};

module.exports = QRBitBuffer;

};

defs['QRMath']=function(module,exports,require){
var QRMath = {

	glog : function(n) {
	
		if (n < 1) {
			throw new Error("glog(" + n + ")");
		}
		
		return QRMath.LOG_TABLE[n];
	},
	
	gexp : function(n) {
	
		while (n < 0) {
			n += 255;
		}
	
		while (n >= 256) {
			n -= 255;
		}
	
		return QRMath.EXP_TABLE[n];
	},
	
	EXP_TABLE : new Array(256),
	
	LOG_TABLE : new Array(256)

};
	
for (var i = 0; i < 8; i++) {
	QRMath.EXP_TABLE[i] = 1 << i;
}
for (var i = 8; i < 256; i++) {
	QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4]
		^ QRMath.EXP_TABLE[i - 5]
		^ QRMath.EXP_TABLE[i - 6]
		^ QRMath.EXP_TABLE[i - 8];
}
for (var i = 0; i < 255; i++) {
	QRMath.LOG_TABLE[QRMath.EXP_TABLE[i] ] = i;
}

module.exports = QRMath;

};

defs['QRPolynomial']=function(module,exports,require){
var QRMath = require('./QRMath');

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}
};

module.exports = QRPolynomial;

};

function fit(x,t,fs,maxw,F){x.font='bold '+fs+'px '+F;while(x.measureText(t).width>maxw&&fs>12){fs-=1;x.font='bold '+fs+'px '+F}}
function draw(vehicle,serial,d,company){
var W=400,H=1080,k=parseInt(sz.value,10)/W;
cv.width=Math.round(W*k);cv.height=Math.round(H*k);
var x=cv.getContext('2d');
x.setTransform(k,0,0,k,0,0);x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#000';x.strokeStyle='#000';x.lineJoin='round';
if(LOGO.complete&&LOGO.naturalWidth)x.drawImage(LOGO,20,10,360,81);
x.translate(0,100);x.textBaseline='alphabetic';
var F='"DejaVu Sans",Arial,Helvetica,sans-serif';
function T(t,px,py,size,al,maxw){x.textAlign=al;fit(x,t,size,maxw||W-24,F);x.lineWidth=1.6;x.fillText(t,px,py);x.strokeText(t,px,py)}
T('GATE PASS',W/2,52,54,'center');
x.fillRect(16,68,W-32,4);
if(company)T(company,W/2,112,36,'center');
T('No: '+prefix(d)+'-'+pad(serial,4),W/2,154,30,'center');
var st=stamp(d).split('  ');T(st[0],W/2,194,36,'center');T(st[1],W/2,236,36,'center');
var q=new QRLib(0,0);q.addData(vehicle);q.make();
var n=q.getModuleCount(),s=Math.max(2,Math.floor(300/n)),size=n*s,ox=Math.floor((W-size)/2),oy=256;
for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(q.isDark(r,c))x.fillRect(ox+c*s,oy+r*s,s,s);
var shown=vehicle.replace(/^([A-Z]{2}\d{1,2})([A-Z0-9]+)$/,'$1 $2');
T(shown,W/2,oy+size+76,72,'center',W-16);
x.fillRect(16,oy+size+100,W-32,3);
var y1=oy+size+180;
x.fillRect(36,y1,W-72,3);T('Security Sign',W/2,y1+34,28,'center');
var y2=y1+150;
x.fillRect(36,y2,W-72,3);T('Office Sign',W/2,y2+34,28,'center');
T('Thank you for your cooperation',W/2,y2+80,22,'center',W-24);
}
var ready=false,pending=null,lastNo='',dl=null,pimg=document.getElementById('pimg');
try{if(window.claude&&claude.use)claude.use('downloads').then(function(d){dl=d}).catch(function(){})}catch(e){}
function dayKey(d){return 'gpl:'+d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2)}
function getLog(d){try{return JSON.parse(localStorage.getItem(dayKey(d))||'{}')}catch(e){return {}}}
function addLog(v,d,no){var l=getLog(d);l[v]={t:stamp(d).split('  ')[1],no:no};try{localStorage.setItem(dayKey(d),JSON.stringify(l))}catch(e){}}
function binarize(){var x=cv.getContext('2d'),d=x.getImageData(0,0,cv.width,cv.height),a=d.data;for(var i=0;i<a.length;i+=4){var v=(a[i]*0.3+a[i+1]*0.59+a[i+2]*0.11)<170?0:255;a[i]=a[i+1]=a[i+2]=v;a[i+3]=255}x.putImageData(d,0,0)}
function doGenerate(v,cb){
var s=parseInt(ser.value,10);if(!(s>0))s=getNext();
var now=new Date(),no=prefix(now)+'-'+pad(s,4);
draw(v,s,now,comp.value.trim());binarize();
setNext(s+1);ser.value=s+1;addLog(v,now,no);
lastNo=no;pimg.src=cv.toDataURL('image/png');pimg.style.display='inline-block';
msg.textContent='Pass '+no+' is ready.';ready=true;
if(cb)cb()}
function generate(cb){
var v=veh.value.replace(/[^A-Za-z0-9]/g,'').toUpperCase();
if(!v){msg.textContent='Enter the vehicle number.';veh.focus();return}
var prev=getLog(new Date())[v];
if(prev){pending=function(){doGenerate(v,cb)};
document.getElementById('dtxt').textContent=v+' already has a pass today ('+prev.no+' at '+prev.t+'). Generate again?';
document.getElementById('dlg').style.display='flex';document.getElementById('dyes').focus();return}
doGenerate(v,cb)}
function closeDlg(){document.getElementById('dlg').style.display='none';pending=null}
document.getElementById('dyes').onclick=function(){var f=pending;closeDlg();if(f)f()};
document.getElementById('dno').onclick=closeDlg;
document.getElementById('gen').onclick=function(){generate()};
function act(fn){if(ready)fn();else generate(fn)}
function doPrint(){
var b64=cv.toDataURL('image/png').split(',')[1];
var url='intent:image/png;base64,'+b64+'#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;';
var a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';
document.body.appendChild(a);a.click();document.body.removeChild(a);
msg.textContent='Sent to RawBT: '+lastNo+'. If nothing opened, RawBT is not installed or the browser blocked it.'}
function doSave(){
if(!dl){msg.textContent='Press and hold the pass image, then choose Save image.';return}
cv.toBlob(function(b){dl.save({filename:'GatePass_'+lastNo+'.png',data:b}).then(function(){msg.textContent='Saved '+lastNo+'.'}).catch(function(e){msg.textContent=(e&&e.code==='declined')?'Save cancelled.':'Could not save. Press and hold the pass image, then choose Save image.'})},'image/png')}
function doShare(){
cv.toBlob(function(b){
var f=new File([b],'GatePass_'+lastNo+'.png',{type:'image/png'});
if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(e){if(e&&e.name==='AbortError')return;doSave()})}
else doSave()},'image/png')}
document.getElementById('shr').onclick=function(){act(doShare)};
sz.addEventListener('change',function(){try{localStorage.setItem('gp:size',sz.value)}catch(e){}ready=false});
try{var sv=localStorage.getItem('gp:size');if(sv)sz.value=sv}catch(e){}
document.getElementById('prt').onclick=function(){act(doPrint)};
document.getElementById('sav').onclick=function(){act(doSave)};
veh.addEventListener('input',function(){ready=false});
comp.addEventListener('input',function(){ready=false});
veh.addEventListener('keydown',function(e){if(e.key==='Enter')generate()});
ser.value=getNext();pre.textContent=prefix(new Date());
